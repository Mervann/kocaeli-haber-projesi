<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kocaeli Haber İzleme Sistemi</title>
    <meta name="description" content="Kocaeli yerel haberlerinin harita üzerinde görselleştirilmesi ve izlenmesi sistemi">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <h1>Kocaeli Haber İzleme</h1>
            </div>
            <span class="subtitle">Kentsel Haber İzleme ve Harita Görselleştirme Sistemi</span>
        </div>
        <div class="header-right">
            <div class="news-count" id="news-count-badge">
                <span id="news-count">0</span> Haber
            </div>
            <a href="/kaynak-detay" class="btn btn-ghost" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                Kaynak Detay
            </a>
            <button class="btn btn-primary" id="btn-scrape" onclick="triggerScrape()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 11-6.219-8.56"/>
                    <polyline points="21 3 21 9 15 9"/>
                </svg>
                Haberleri Çek
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-main">
        <!-- Sidebar Filters -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-section">
                <h3 class="section-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Filtreler
                </h3>
            </div>

            <!-- News Type Filter -->
            <div class="sidebar-section">
                <h4 class="filter-label">Haber Türü</h4>
                <div class="filter-checkboxes" id="type-filters">
                    <label class="checkbox-item" data-type="Trafik Kazası">
                        <input type="checkbox" value="Trafik Kazası" checked>
                        <span class="checkbox-marker marker-trafik"></span>
                        <span class="checkbox-text">Trafik Kazası</span>
                        <span class="checkbox-count" id="count-trafik">0</span>
                    </label>
                    <label class="checkbox-item" data-type="Yangın">
                        <input type="checkbox" value="Yangın" checked>
                        <span class="checkbox-marker marker-yangin"></span>
                        <span class="checkbox-text">Yangın</span>
                        <span class="checkbox-count" id="count-yangin">0</span>
                    </label>
                    <label class="checkbox-item" data-type="Elektrik Kesintisi">
                        <input type="checkbox" value="Elektrik Kesintisi" checked>
                        <span class="checkbox-marker marker-elektrik"></span>
                        <span class="checkbox-text">Elektrik Kesintisi</span>
                        <span class="checkbox-count" id="count-elektrik">0</span>
                    </label>
                    <label class="checkbox-item" data-type="Hırsızlık">
                        <input type="checkbox" value="Hırsızlık" checked>
                        <span class="checkbox-marker marker-hirsizlik"></span>
                        <span class="checkbox-text">Hırsızlık</span>
                        <span class="checkbox-count" id="count-hirsizlik">0</span>
                    </label>
                    <label class="checkbox-item" data-type="Kültürel Etkinlikler">
                        <input type="checkbox" value="Kültürel Etkinlikler" checked>
                        <span class="checkbox-marker marker-kultur"></span>
                        <span class="checkbox-text">Kültürel Etkinlikler</span>
                        <span class="checkbox-count" id="count-kultur">0</span>
                    </label>
                </div>
            </div>

            <!-- District Filter -->
            <div class="sidebar-section">
                <h4 class="filter-label">İlçe</h4>
                <select id="district-filter" class="filter-select">
                    <option value="">Tüm İlçeler</option>
                </select>
            </div>

            <!-- Date Filter -->
            <div class="sidebar-section">
                <h4 class="filter-label">Tarih Aralığı</h4>
                <div class="date-inputs">
                    <div class="date-field">
                        <label>Başlangıç</label>
                        <input type="date" id="date-from" class="filter-date">
                    </div>
                    <div class="date-field">
                        <label>Bitiş</label>
                        <input type="date" id="date-to" class="filter-date">
                    </div>
                </div>
            </div>

            <!-- Apply / Reset -->
            <div class="sidebar-section sidebar-actions">
                <button class="btn btn-accent" onclick="applyFilters()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Filtrele
                </button>
                <button class="btn btn-ghost" onclick="resetFilters()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Sıfırla
                </button>
            </div>

            <!-- Scraping Status -->
            <div class="sidebar-section" id="scrape-status-section" style="display:none;">
                <h4 class="filter-label">Scraping Durumu</h4>
                <div class="scrape-status" id="scrape-status">
                    <div class="spinner"></div>
                    <span id="scrape-message">Başlatılıyor...</span>
                </div>
            </div>

            <!-- News List -->
            <div class="sidebar-section news-list-section">
                <h4 class="filter-label">Son Haberler</h4>
                <div class="news-list" id="news-list"></div>
            </div>
        </aside>

        <!-- Map -->
        <div id="map-container">
            <div id="map"></div>
            <!-- Loading overlay -->
            <div id="loading-overlay" style="display:none;">
                <div class="loading-content">
                    <div class="spinner-large"></div>
                    <p>Haberler yükleniyor...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Stats Modal Overlay -->
    <div id="stats-modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#1a1a2e; border-radius:12px; padding:24px; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; color:#e0e0e0; position:relative;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="margin:0; font-size:18px; color:#fff;">📊 Kaynak İstatistikleri</h2>
                <button onclick="closeStatsModal()" style="background:none; border:none; color:#aaa; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div id="stats-modal-body"></div>
        </div>
    </div>

    <script src="js/map.js?v=99"></script>
    <script src="js/filters.js"></script>
    <script src="js/app.js?v=99"></script>
</body>
</html>
